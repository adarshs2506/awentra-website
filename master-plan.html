<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greenfield Enclave — Interactive Masterplan</title>
<style>
  :root{
    --bg:#0E1116;
    --panel:#161B22;
    --panel-2:#1D242D;
    --line:rgba(255,255,255,0.08);
    --paper:#EDEFF2;
    --muted:#8A93A0;
    --available:#34D399;
    --available-solid:#22C55E;
    --booked:#FBBF24;
    --booked-solid:#F59E0B;
    --sold:#F87171;
    --sold-solid:#EF4444;
    --accent:#3B82F6;
    --whatsapp:#25D366;
    --road:#2B2F35;
    --grass:#264D33;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#05070A;
    color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .app{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;overflow:hidden;}
  .blurred{filter:blur(6px);transition:filter .25s ease;pointer-events:none;}
  .not-blurred{filter:blur(0);transition:filter .25s ease;}

  /* Header */
  .topbar{
    background:var(--panel);border-bottom:1px solid var(--line);
    padding:12px 14px;display:flex;align-items:center;gap:10px;
  }
  .logo{
    width:40px;height:40px;border-radius:8px;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);
    flex-shrink:0;text-align:center;line-height:1.2;
  }
  .proj-name{font-size:15px;font-weight:600;}
  .proj-loc{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:1px;}
  .topbar .icon-btn{
    width:36px;height:36px;border-radius:50%;background:var(--panel-2);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    color:var(--paper);flex-shrink:0;
  }
  .wa-header-btn{
    margin-left:auto;background:var(--whatsapp);border:none;color:#042412;
    padding:9px 14px;border-radius:8px;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;gap:6px;flex-shrink:0;
  }

  .searchbar{
    padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;gap:8px;
  }
  .searchbar input{
    flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;color:var(--paper);font-size:14px;
  }
  .searchbar input::placeholder{color:var(--muted);}
  .searchbar button{
    background:var(--accent);border:none;color:white;border-radius:8px;
    padding:0 18px;font-size:13px;font-weight:600;cursor:pointer;
  }

  /* Map viewport */
  .map-viewport{
    position:relative;overflow:hidden;height:62vh;min-height:440px;
    background:linear-gradient(160deg,#3a2f22,#2a2318);
    touch-action:none;
  }
  .map-canvas{
    position:absolute;top:50%;left:50%;transform-origin:center;
    width:900px;transition:transform .35s ease;
  }
  .map-canvas.mode-3d{ transform: translate(-50%,-50%) perspective(900px) rotateX(28deg) scale(0.92); }
  .map-canvas svg{display:block;width:100%;height:auto;}

  .compass{
    position:absolute;top:14px;left:14px;width:48px;height:48px;border-radius:50%;
    background:rgba(22,27,34,0.92);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font-size:10px;font-weight:700;color:var(--accent);z-index:5;
  }
  .toggle-3d{
    position:absolute;top:70px;left:14px;width:48px;height:48px;border-radius:50%;
    background:rgba(22,27,34,0.92);border:1px solid var(--line);color:var(--paper);
    font-size:11px;font-weight:700;cursor:pointer;z-index:5;
  }
  .zoom-controls{
    position:absolute;right:12px;top:14px;display:flex;flex-direction:column;gap:8px;z-index:5;
  }
  .zoom-controls button{
    width:36px;height:36px;border-radius:8px;background:rgba(22,27,34,0.92);
    border:1px solid var(--line);color:var(--paper);font-size:16px;cursor:pointer;
  }
  .pct-badge{
    position:absolute;right:12px;bottom:12px;z-index:5;
    background:rgba(22,27,34,0.92);border:1px solid var(--line);color:var(--accent);
    font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;
  }

  /* Legend panel */
  .legend-panel{
    position:absolute;left:12px;bottom:12px;z-index:5;
    background:rgba(22,27,34,0.96);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;width:190px;
  }
  .legend-panel .lp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .legend-panel h4{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .mini-toggle{width:32px;height:18px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);position:relative;cursor:pointer;flex-shrink:0;}
  .mini-toggle::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--paper);transition:left .2s ease;}
  .mini-toggle.on::after{left:16px;background:var(--accent);}
  .legend-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 4px;font-size:13.5px;border-bottom:1px solid var(--line);
    cursor:pointer;border-radius:6px;transition:background .15s ease;
  }
  .legend-row:hover{background:var(--panel-2);}
  .legend-row.active-filter{background:var(--panel-2);}
  .legend-row:last-of-type{border-bottom:none;}
  .legend-row .l{display:flex;align-items:center;gap:8px;}
  .ring{width:11px;height:11px;border-radius:50%;border:2px solid; display:inline-block;}
  .ring.available{border-color:var(--available);}
  .ring.booked{border-color:var(--booked);}
  .ring.sold{border-color:var(--sold);}
  .legend-row.available b{color:var(--available);}
  .legend-row.booked b{color:var(--booked);}
  .legend-row.sold b{color:var(--sold);}
  .total-row{display:flex;justify-content:space-between;padding-top:8px;margin-top:2px;font-size:13px;color:var(--muted);}
  .total-row b{color:var(--paper);}

  .action-row{display:flex;gap:10px;padding:12px 14px;background:var(--panel);}
  .action-row button{
    flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--paper);
    padding:11px;border-radius:8px;font-size:13px;cursor:pointer;
  }

  .plot-shape{cursor:pointer;}
  .plot-shape rect{transition:fill .15s ease,opacity .15s ease;}
  .plot-shape:hover rect.available-fill{fill:var(--available-solid) !important;}
  .plot-shape:hover rect.booked-fill{fill:var(--booked-solid) !important;}
  .plot-shape:hover rect.sold-fill{fill:var(--sold-solid) !important;}
  .plot-label{font-size:19px;font-weight:700;fill:#fff;pointer-events:none;}

  /* Hover tooltip */
  .hover-tip{
    position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;width:200px;pointer-events:none;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);display:none;
  }
  .hover-tip.show{display:block;}
  .hover-tip .pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:8px;}
  .hover-tip .pill.available{background:rgba(52,211,153,0.15);color:var(--available);}
  .hover-tip .pill.booked{background:rgba(251,191,36,0.15);color:var(--booked);}
  .hover-tip .pill.sold{background:rgba(248,113,113,0.15);color:var(--sold);}
  .hover-tip .plotno{font-size:11px;color:var(--muted);margin-left:6px;font-weight:600;}
  .hover-tip .size{font-size:15px;font-weight:700;margin:0 0 3px;}
  .hover-tip .dims{font-size:12px;color:var(--muted);}

  /* Detail sheet */
  .sheet-overlay{
    position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;
  }
  .sheet-overlay.open{display:flex;}
  .sheet{
    background:var(--panel);width:100%;max-width:400px;border-radius:16px;
    padding:22px;border:1px solid var(--line);max-height:90vh;overflow-y:auto;
  }
  .sheet-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .sheet .pill{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;}
  .sheet .pill.available{background:rgba(52,211,153,0.15);color:var(--available);}
  .sheet .pill.booked{background:rgba(251,191,36,0.15);color:var(--booked);}
  .sheet .pill.sold{background:rgba(248,113,113,0.15);color:var(--sold);}
  .pill .dotp{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;}
  .sheet .close-x{
    width:30px;height:30px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);
    color:var(--paper);font-size:15px;cursor:pointer;flex-shrink:0;
  }
  .sheet h3{margin:2px 0 2px;font-size:26px;}
  .sheet .loc{font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px;}

  .diagram-box{
    background:var(--panel-2);border-radius:10px;padding:20px;margin-bottom:16px;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  }
  .diagram-row{display:flex;align-items:center;gap:10px;}
  .dim-v{font-size:10px;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);}
  .plot-rect{border:2px solid var(--available);background:rgba(52,211,153,0.08);border-radius:3px;}
  .dim-h{font-size:10px;color:var(--muted);text-align:center;margin-top:4px;}

  .sheet .row{display:flex;justify-content:space-between;padding:10px 0;font-size:13.5px;border-bottom:1px solid var(--line);}
  .sheet .row span:first-child{color:var(--muted);letter-spacing:.03em;text-transform:uppercase;font-size:11.5px;}
  .sheet .row span:last-child{font-weight:600;}
  .sheet .row.status-row span:last-child.available{color:var(--available);}

  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .sheet-actions button{
    flex:1;padding:13px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-whatsapp{background:var(--whatsapp);color:#042412;}
  .btn-call{background:#2E3A8C;color:#fff;}
  .sheet-actions button:disabled{background:var(--panel-2);color:var(--muted);cursor:not-allowed;}
</style>
</head>
<body>
<div class="app" id="appRoot">

  <div id="mainContent" class="not-blurred">
    <div class="topbar">
      <div class="logo">YOUR<br>LOGO</div>
      <div>
        <div class="proj-name">Greenfield Enclave</div>
        <div class="proj-loc">Lucknow, Uttar Pradesh</div>
      </div>
      <button class="icon-btn" id="headerCallBtn" aria-label="Call">☎</button>
      <button class="wa-header-btn" id="waHeaderBtn">WhatsApp</button>
    </div>

    <div class="searchbar">
      <input type="text" id="searchInput" placeholder="Search plot number">
      <button id="searchBtn">Go</button>
    </div>

    <div class="map-viewport" id="viewport">
      <div class="compass"><span style="color:var(--accent);">▲</span>N</div>
      <button class="toggle-3d" id="toggle3d">2D</button>
      <div class="zoom-controls">
        <button id="zoomIn">+</button>
        <button id="zoomOut">–</button>
        <button id="zoomReset" style="font-size:10px;">RST</button>
      </div>
      <div class="pct-badge" id="pctBadge">0%</div>

      <div class="legend-panel">
        <div class="lp-head">
          <h4>Status</h4>
          <div class="mini-toggle" id="legendToggle"></div>
        </div>
        <div class="legend-row available" data-status="available" role="button" tabindex="0"><span class="l"><span class="ring available"></span>Available</span><b id="cntAvailable">0</b></div>
        <div class="legend-row booked" data-status="booked" role="button" tabindex="0"><span class="l"><span class="ring booked"></span>Booked</span><b id="cntBooked">0</b></div>
        <div class="legend-row sold" data-status="sold" role="button" tabindex="0"><span class="l"><span class="ring sold"></span>Sold</span><b id="cntSold">0</b></div>
        <div class="total-row"><span>Total</span><b id="cntTotal">0</b></div>
      </div>

      <div class="map-canvas" id="mapCanvas">
        <svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
          <rect width="900" height="620" fill="#3a2f22"/>
          <rect x="0" y="0" width="900" height="620" fill="var(--grass)" opacity="0.15"/>
          <rect x="0" y="140" width="900" height="30" fill="var(--road)"/>
          <rect x="0" y="330" width="900" height="30" fill="var(--road)"/>
          <rect x="0" y="500" width="900" height="30" fill="var(--road)"/>
          <rect x="290" y="0" width="30" height="620" fill="var(--road)"/>
          <rect x="580" y="0" width="30" height="620" fill="var(--road)"/>
          <g id="plotsLayer"></g>
        </svg>
      </div>

      <div class="hover-tip" id="hoverTip"></div>
    </div>

    <div class="action-row">
      <button id="galleryBtn">Gallery</button>
      <button id="locationBtn">Location</button>
    </div>
  </div>

</div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheetContent"></div>
</div>

<script>
  // ---- Editable contact numbers ----
  const WHATSAPP_NUMBER = '917355150877';
  const PHONE_NUMBER = '+917355150877';
  const PROJECT_LOCATION = 'Lucknow, Uttar Pradesh, India';

  // ---- Plot layout data — edit positions/status/sizes here ----
  const rows = [
    { y: 20, h: 110, cols: [ {x:10,w:130},{x:150,w:130},{x:320,w:130},{x:460,w:110},{x:620,w:130},{x:760,w:130} ] },
    { y: 180, h: 140, cols: [ {x:10,w:130},{x:150,w:130},{x:320,w:120},{x:450,w:120},{x:580,w:120},{x:710,w:180} ] },
    { y: 370, h: 120, cols: [ {x:10,w:130},{x:150,w:130},{x:320,w:120},{x:450,w:120},{x:580,w:120},{x:710,w:180} ] },
  ];
  const statuses = ['available','available','available','booked','available','available','sold','available','booked','available',
                     'available','sold','available','booked','available','available','available','booked'];
  const facings = ['North','East','West','South'];

  let id = 1;
  const plots = [];
  rows.forEach(r => {
    r.cols.forEach(c => {
      const sqft = Math.round((c.w * r.h) / 8);
      plots.push({
        id: id,
        x: c.x, y: r.y, w: c.w, h: r.h,
        status: statuses[(id-1) % statuses.length],
        facing: facings[id % facings.length],
        sqft: sqft,
        sqm: Math.round(sqft * 0.0929 * 10) / 10,
        sqyd: Math.round(sqft * 0.1111 * 10) / 10,
        dimW: Math.round((c.w / 20) * 10) / 10,
        dimH: Math.round((r.h / 20) * 10) / 10
      });
      id++;
    });
  });

  const svgns = 'http://www.w3.org/2000/svg';
  const layer = document.getElementById('plotsLayer');

  function colorFor(status){
    if (status === 'available') return 'rgba(52,211,153,0.35)';
    if (status === 'booked') return 'rgba(251,191,36,0.35)';
    return 'rgba(248,113,113,0.35)';
  }
  function strokeFor(status){
    if (status === 'available') return 'var(--available)';
    if (status === 'booked') return 'var(--booked)';
    return 'var(--sold)';
  }

  plots.forEach(p => {
    const g = document.createElementNS(svgns, 'g');
    g.setAttribute('class', 'plot-shape');
    g.dataset.id = p.id;

    const rect = document.createElementNS(svgns, 'rect');
    rect.setAttribute('x', p.x);
    rect.setAttribute('y', p.y);
    rect.setAttribute('width', p.w);
    rect.setAttribute('height', p.h);
    rect.setAttribute('rx', 3);
    rect.setAttribute('fill', colorFor(p.status));
    rect.setAttribute('stroke', strokeFor(p.status));
    rect.setAttribute('stroke-width', 2);
    if (p.status === 'available') rect.setAttribute('class', 'available-fill');
    if (p.status === 'booked') rect.setAttribute('class', 'booked-fill');
    if (p.status === 'sold') rect.setAttribute('class', 'sold-fill');
    g.appendChild(rect);

    const label = document.createElementNS(svgns, 'text');
    label.setAttribute('x', p.x + p.w / 2);
    label.setAttribute('y', p.y + p.h / 2 + 7);
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('class', 'plot-label');
    label.textContent = p.id;
    g.appendChild(label);

    g.addEventListener('click', () => openSheet(p.id));
    g.addEventListener('mouseenter', (e) => showTip(p, e));
    g.addEventListener('mousemove', (e) => positionTip(e));
    g.addEventListener('mouseleave', hideTip);

    layer.appendChild(g);
  });

  function updateCounts(){
    const avail = plots.filter(p => p.status === 'available').length;
    const booked = plots.filter(p => p.status === 'booked').length;
    const sold = plots.filter(p => p.status === 'sold').length;
    document.getElementById('cntAvailable').textContent = avail;
    document.getElementById('cntBooked').textContent = booked;
    document.getElementById('cntSold').textContent = sold;
    document.getElementById('cntTotal').textContent = plots.length;
    document.getElementById('pctBadge').textContent = Math.round(((booked + sold) / plots.length) * 100) + '%';
  }
  updateCounts();

  document.getElementById('legendToggle').addEventListener('click', function(){
    this.classList.toggle('on');
  });

  // ---- Status legend filter ----
  let activeFilterStatus = null;
  document.querySelectorAll('.legend-row[data-status]').forEach(row => {
    row.addEventListener('click', () => {
      const status = row.dataset.status;
      activeFilterStatus = (activeFilterStatus === status) ? null : status;
      document.querySelectorAll('.legend-row[data-status]').forEach(r => {
        r.classList.toggle('active-filter', r.dataset.status === activeFilterStatus);
      });
      document.querySelectorAll('.plot-shape').forEach(g => {
        const plotId = parseInt(g.dataset.id, 10);
        const plot = plots.find(p => p.id === plotId);
        const dim = activeFilterStatus && plot.status !== activeFilterStatus;
        g.style.opacity = dim ? '0.2' : '1';
      });
    });
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') row.click(); });
  });

  // ---- Hover tooltip ----
  const hoverTip = document.getElementById('hoverTip');
  const viewport = document.getElementById('viewport');
  function statusLabelOf(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  function showTip(p, e){
    hoverTip.innerHTML = `
      <span class="pill ${p.status}">${statusLabelOf(p.status)}</span>
      <span class="plotno">Plot #${p.id}</span>
      <div class="size">${p.sqyd} Sq.Yd</div>
      <div class="dims">${p.dimW} × ${p.dimH} ft · ${p.facing} Facing</div>
    `;
    hoverTip.classList.add('show');
    positionTip(e);
  }
  function positionTip(e){
    const rect = viewport.getBoundingClientRect();
    let x = e.clientX - rect.left + 16;
    let y = e.clientY - rect.top + 16;
    if (x + 200 > rect.width) x = e.clientX - rect.left - 216;
    if (y + 110 > rect.height) y = e.clientY - rect.top - 130;
    hoverTip.style.left = x + 'px';
    hoverTip.style.top = y + 'px';
  }
  function hideTip(){ hoverTip.classList.remove('show'); }

  // ---- Detail sheet ----
  const sheetOverlay = document.getElementById('sheetOverlay');
  const sheetContent = document.getElementById('sheetContent');
  const mainContent = document.getElementById('mainContent');

  function openSheet(plotId){
    const p = plots.find(pl => pl.id === plotId);
    if (!p) return;
    hideTip();
    const sl = statusLabelOf(p.status);
    const isAvailable = p.status === 'available';
    const boxW = Math.min(160, p.dimW * 8);
    const boxH = Math.min(90, p.dimH * 8);

    sheetContent.innerHTML = `
      <div class="sheet-top">
        <div><span class="pill ${p.status}"><span class="dotp"></span>${sl}</span></div>
        <button class="close-x" id="sheetClose">&times;</button>
      </div>
      <h3>Plot #${p.id}</h3>
      <div class="loc">Lucknow, Uttar Pradesh</div>

      <div class="diagram-box">
        <div class="diagram-row">
          <span class="dim-v">${p.dimH} ft</span>
          <div class="plot-rect" style="width:${boxW}px;height:${boxH}px;border-color:${strokeFor(p.status)};"></div>
        </div>
        <span class="dim-h">${p.dimW} ft</span>
      </div>

      <div class="row"><span>Sq. Feet</span><span>${p.sqft} Sq.Ft</span></div>
      <div class="row"><span>Sq. Meters</span><span>${p.sqm} Sq.M</span></div>
      <div class="row"><span>Dimensions</span><span>${p.dimW} × ${p.dimH} ft</span></div>
      <div class="row"><span>Facing</span><span>↑ ${p.facing}</span></div>
      <div class="row status-row"><span>Status</span><span class="${p.status}">${sl}</span></div>

      <div class="sheet-actions">
        <button class="btn-whatsapp" id="waBtn">WhatsApp</button>
        <button class="btn-call" id="callBtn">Call now</button>
      </div>
    `;

    sheetContent.querySelector('#sheetClose').addEventListener('click', closeSheet);
    sheetContent.querySelector('#waBtn').addEventListener('click', () => {
      const msg = encodeURIComponent('Hi, I am interested in Plot #' + p.id + ' at Greenfield Enclave (' + sl + ').');
      window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
    });
    sheetContent.querySelector('#callBtn').addEventListener('click', () => {
      window.location.href = `tel:${PHONE_NUMBER}`;
    });

    mainContent.classList.remove('not-blurred');
    mainContent.classList.add('blurred');
    sheetOverlay.classList.add('open');
  }
  function closeSheet(){
    sheetOverlay.classList.remove('open');
    mainContent.classList.remove('blurred');
    mainContent.classList.add('not-blurred');
  }
  sheetOverlay.addEventListener('click', (e) => { if (e.target === sheetOverlay) closeSheet(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  // ---- Header WhatsApp button ----
  document.getElementById('waHeaderBtn').addEventListener('click', () => {
    window.location.href = `https://wa.me/${WHATSAPP_NUMBER}`;
  });

  // ---- Search ----
  document.getElementById('searchBtn').addEventListener('click', doSearch);
  document.getElementById('searchInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
  function doSearch(){
    const val = parseInt(document.getElementById('searchInput').value, 10);
    if (!val) return;
    const p = plots.find(pl => pl.id === val);
    if (p) openSheet(val);
  }

  // ---- 3D / 2D toggle ----
  const mapCanvas = document.getElementById('mapCanvas');
  const toggle3d = document.getElementById('toggle3d');
  let is3d = false;
  toggle3d.addEventListener('click', () => {
    is3d = !is3d;
    mapCanvas.classList.toggle('mode-3d', is3d);
    toggle3d.textContent = is3d ? '3D' : '2D';
  });

  // ---- Zoom / pan ----
  let scale = 1, panX = 0, panY = 0;
  function applyTransform(){
    if (!is3d) {
      mapCanvas.style.transform = `translate(-50%,-50%) translate(${panX}px,${panY}px) scale(${scale})`;
    }
  }
  document.getElementById('zoomIn').addEventListener('click', () => { scale = Math.min(scale + 0.2, 3); applyTransform(); });
  document.getElementById('zoomOut').addEventListener('click', () => { scale = Math.max(scale - 0.2, 0.5); applyTransform(); });
  document.getElementById('zoomReset').addEventListener('click', () => { scale = 1; panX = 0; panY = 0; applyTransform(); });
  applyTransform();

  let dragging = false, startX = 0, startY = 0;
  viewport.addEventListener('pointerdown', (e) => { dragging = true; startX = e.clientX - panX; startY = e.clientY - panY; });
  window.addEventListener('pointerup', () => dragging = false);
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    panX = e.clientX - startX; panY = e.clientY - startY;
    applyTransform();
  });

  // ---- Gallery / Location placeholders ----
  document.getElementById('headerCallBtn').addEventListener('click', () => {
    window.location.href = `tel:${PHONE_NUMBER}`;
  });
  document.getElementById('galleryBtn').addEventListener('click', () => alert('Add your project gallery images here.'));
  document.getElementById('locationBtn').addEventListener('click', () => {
    window.open(`https://www.google.com/maps?q=${encodeURIComponent(PROJECT_LOCATION)}`, '_blank');
  });
</script>
</body>
</html>

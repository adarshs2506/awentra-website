<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision Build Tech - Masterplan Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Top Bar Header */
    .topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: #161b22;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }

    .brand-title { font-size: 15px; font-weight: 800; }
    .brand-sub { font-size: 10px; font-weight: 700; color: #38bdf8; }

    .search-box {
      display: flex;
      align-items: center;
      background: #0d1117;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 4px 8px;
      width: 300px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 13px;
      width: 100%;
    }

    /* Left Control Sidebar */
    .left-controls {
      position: absolute;
      top: 80px; 
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 90;
    }

    .toggle-3d-btn {
      background: #21262d;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 800;
      width: 44px; height: 44px;
      border-radius: 8px;
      cursor: pointer;
    }

    .status-panel {
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 14px;
      width: 160px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-top: 6px;
    }

    .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }
    .dot.available { background: #238636; }
    .dot.booked { background: #d29922; }
    .dot.sold { background: #da3633; }

    /* Viewport Area */
    .viewport {
      position: absolute;
      top: 60px; left: 0; right: 0; bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0d1117;
      perspective: 1200px;
      padding-left: 180px;
    }

    /* Main Container with IMAGE Background */
    .map-container {
      position: relative;
      width: 85%;
      height: 85%;
      background-color: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      transition: transform 0.6s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .map-container.perspective-3d {
      transform: rotateX(45deg) rotateZ(-8deg) scale(0.9);
      box-shadow: 0 30px 60px rgba(0,0,0,0.9);
    }

    /* MAP IMAGE STYLING */
    .masterplan-img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
    }

    /* Interactive Overlay Plots Area */
    .plots-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .plot {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
    }

    .plot.available { background: rgba(35, 134, 54, 0.7); }
    .plot.sold { background: rgba(218, 54, 51, 0.7); }
    .plot.booked { background: rgba(210, 153, 34, 0.7); }

    .plot:hover {
      transform: scale(1.08);
      filter: brightness(1.3);
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div>
      <div class="brand-title">VISION BUILD TECH</div>
      <div class="brand-sub">RAIPUR, CHHATTISGARH</div>
    </div>
    <div class="search-box">
      <input type="text" placeholder="Search plot number...">
    </div>
  </div>

  <div class="left-controls">
    <button class="toggle-3d-btn" id="btn3D">3D</button>
    <div class="status-panel">
      <h4 style="font-size: 11px; color:#8b949e;">STATUS</h4>
      <div class="status-item"><span><span class="dot available"></span> Available</span><b>27</b></div>
      <div class="status-item"><span><span class="dot booked"></span> Booked</span><b>3</b></div>
      <div class="status-item"><span><span class="dot sold"></span> Sold</span><b>8</b></div>
    </div>
  </div>

  <div class="viewport">
    <div class="map-container" id="map">
      <!-- AAPKI MASTERPLAN IMAGE YEHA LAGEGI -->
      <img src="masterplan.jpg" alt="Masterplan Map" class="masterplan-img" onerror="this.style.display='none'; document.getElementById('no-img-msg').style.display='block';">
      <p id="no-img-msg" style="display:none; color:#8b949e; z-index:1;">⚠️ 'masterplan.jpg' image file folder mein add karein.</p>

      <!-- Plot Overlays Positioned Over the Map Image -->
      <div class="plots-overlay">
        <div class="plot available" style="top: 20%; left: 15%; width: 12%; height: 25%;">Plot #1</div>
        <div class="plot sold" style="top: 20%; left: 30%; width: 12%; height: 25%;">Plot #2</div>
        <div class="plot available" style="top: 20%; left: 45%; width: 12%; height: 25%;">Plot #3</div>
        <div class="plot booked" style="top: 20%; left: 60%; width: 12%; height: 25%;">Plot #4</div>
      </div>
    </div>
  </div>

  <script>
    const btn3D = document.getElementById('btn3D');
    const map = document.getElementById('map');
    let is3D = false;

    btn3D.addEventListener('click', () => {
      is3D = !is3D;
      if (is3D) {
        map.classList.add('perspective-3d');
        btn3D.innerText = '2D';
      } else {
        map.classList.remove('perspective-3d');
        btn3D.innerText = '3D';
      }
    });
  </script>

</body>
</html>
